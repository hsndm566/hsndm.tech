<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live job application dashboard — stats, trends and recent activity." />
  <title>Job Search Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    .skeleton { background: linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 37%,#e5e7eb 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; }
    @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }
    .fade-in { animation: fade .4s ease both } @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <nav class="bg-white border-b sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="font-bold text-lg">📊 Job Dashboard</span>
      <div class="flex gap-2 text-sm">
        <a href="index.html" class="px-3 py-1.5 rounded hover:bg-slate-100">Home</a>
        <a href="dashboard.html" class="px-3 py-1.5 rounded bg-slate-900 text-white">Dashboard</a>
        <a href="cv.html" class="px-3 py-1.5 rounded hover:bg-slate-100">Submit CV</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">Live Job Stats</h1>
      <div class="flex items-center gap-3 text-sm text-slate-500">
        <span id="lastUpdated">—</span>
        <button id="refreshBtn" class="px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Refresh</button>
      </div>
    </div>

    <!-- Stats cards -->
    <section id="statsCards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white rounded-xl shadow-sm p-5"><div class="text-slate-500 text-sm">Total</div><div class="text-3xl font-bold mt-1" id="statTotal"><div class="skeleton h-8 w-16 rounded"></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-5"><div class="text-slate-500 text-sm">Applied</div><div class="text-3xl font-bold mt-1" id="statApplied"><div class="skeleton h-8 w-16 rounded"></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-5"><div class="text-slate-500 text-sm">Interviews</div><div class="text-3xl font-bold mt-1" id="statInterview"><div class="skeleton h-8 w-16 rounded"></div></div></div>
      <div class="bg-white rounded-xl shadow-sm p-5"><div class="text-slate-500 text-sm">Offers</div><div class="text-3xl font-bold mt-1" id="statOffer"><div class="skeleton h-8 w-16 rounded"></div></div></div>
    </section>

    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <!-- Doughnut chart -->
      <section class="bg-white rounded-xl shadow-sm p-6">
        <h2 class="font-semibold mb-4">Status Breakdown</h2>
        <div id="chartSkeleton" class="skeleton h-64 rounded"></div>
        <canvas id="statusChart" class="hidden"></canvas>
      </section>

      <!-- Recent activity table -->
      <section class="bg-white rounded-xl shadow-sm p-6 overflow-x-auto">
        <h2 class="font-semibold mb-4">Recent Activity</h2>
        <table class="w-full text-sm">
          <thead><tr class="text-left text-slate-500 border-b">
            <th class="py-2 pr-3">Date</th><th class="py-2 pr-3">Company</th><th class="py-2 pr-3">Role</th><th class="py-2">Status</th>
          </tr></thead>
          <tbody id="activityBody">
            <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
            <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
          </tbody>
        </table>
      </section>
    </div>
    <p id="errorMsg" class="hidden text-sm text-red-600 mb-6"></p>
  </main>

  <!-- Julie chatbot -->
  <div id="julie" class="fixed bottom-5 right-5 z-40">
    <button id="julieToggle" class="bg-indigo-600 text-white rounded-full w-14 h-14 shadow-lg text-2xl hover:bg-indigo-700">💬</button>
    <div id="juliePanel" class="hidden w-80 bg-white rounded-xl shadow-2xl border mt-2 flex flex-col" style="height:420px">
      <div class="bg-indigo-600 text-white px-4 py-3 rounded-t-xl font-semibold">Julie · Job Assistant</div>
      <div id="julieLog" class="flex-1 overflow-y-auto p-3 space-y-2 text-sm"></div>
      <form id="julieForm" class="p-3 border-t flex gap-2">
        <input id="julieInput" class="flex-1 border rounded px-3 py-2 text-sm" placeholder="Ask Julie…" autocomplete="off" />
        <button class="bg-indigo-600 text-white px-3 rounded text-sm">Send</button>
      </form>
    </div>
  </div>

  <script>
    // ---- Config ----
    var SHEET_ID = "1rivD5luGlZqq6MCEUVvlT263OfUKXrzH6cr9cf0nG3A";
    var SHEET_NAME = "Job Applications Log";
    var JULIE_ENDPOINT = "https://hsndm566.app.n8n.cloud/webhook/julie-chat";
    var REFRESH_MS = 60000;
    var chart;

    function gvizUrl() {
      return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?sheet=" + encodeURIComponent(SHEET_NAME) + "&tqx=out:json";
    }
    function parseGviz(text) {
      var start = text.indexOf("{");
      var end = text.lastIndexOf("}");
      var obj = JSON.parse(text.substring(start, end + 1));
      var cols = obj.table.cols.map(function (c) { return (c.label || c.id || "").toString().trim(); });
      return obj.table.rows.map(function (r) {
        var o = {};
        (r.c || []).forEach(function (cell, i) { o[cols[i] || ("col" + i)] = cell ? cell.v : null; });
        return o;
      });
    }
    function pick(row, names) {
      var keys = Object.keys(row);
      for (var n = 0; n < names.length; n++) {
        for (var k = 0; k < keys.length; k++) {
          if (keys[k].toLowerCase().indexOf(names[n]) !== -1) return row[keys[k]];
        }
      }
      return "";
    }
    function classify(status) {
      var s = (status || "").toString().toLowerCase();
      if (s.indexOf("offer") !== -1) return "offer";
      if (s.indexOf("interview") !== -1) return "interview";
      if (s.indexOf("reject") !== -1) return "rejected";
      return "applied";
    }

    async function loadData() {
      document.getElementById("errorMsg").classList.add("hidden");
      try {
        var res = await fetch(gvizUrl());
        var text = await res.text();
        var rows = parseGviz(text);
        render(rows);
        document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (e) {
        var em = document.getElementById("errorMsg");
        em.textContent = "Could not load the sheet. Make sure it is shared as 'Anyone with the link can view'. (" + e.message + ")";
        em.classList.remove("hidden");
      }
    }

    function render(rows) {
      var counts = { applied: 0, interview: 0, offer: 0, rejected: 0 };
      rows.forEach(function (r) { counts[classify(pick(r, ["status"]))]++; });

      setStat("statTotal", rows.length);
      setStat("statApplied", counts.applied);
      setStat("statInterview", counts.interview);
      setStat("statOffer", counts.offer);

      // Chart
      document.getElementById("chartSkeleton").classList.add("hidden");
      var canvas = document.getElementById("statusChart");
      canvas.classList.remove("hidden");
      var data = {
        labels: ["Applied", "Interview", "Offer", "Rejected"],
        datasets: [{ data: [counts.applied, counts.interview, counts.offer, counts.rejected],
          backgroundColor: ["#3b82f6", "#f59e0b", "#22c55e", "#ef4444"] }]
      };
      if (chart) { chart.data = data; chart.update(); }
      else { chart = new Chart(canvas, { type: "doughnut", data: data, options: { plugins: { legend: { position: "bottom" } } } }); }

      // Recent activity (last 8)
      var body = document.getElementById("activityBody");
      body.innerHTML = "";
      var recent = rows.slice(-8).reverse();
      if (!recent.length) { body.innerHTML = '<tr><td colspan="4" class="py-3 text-slate-400">No records yet.</td></tr>'; return; }
      recent.forEach(function (r) {
        var tr = document.createElement("tr");
        tr.className = "border-b last:border-0 fade-in";
        tr.innerHTML = "<td class='py-2 pr-3'>" + fmt(pick(r, ["date", "applied"])) + "</td>" +
          "<td class='py-2 pr-3'>" + fmt(pick(r, ["company", "employer"])) + "</td>" +
          "<td class='py-2 pr-3'>" + fmt(pick(r, ["role", "position", "title"])) + "</td>" +
          "<td class='py-2'>" + badge(pick(r, ["status"])) + "</td>";
        body.appendChild(tr);
      });
    }
    function fmt(v) { return v == null || v === "" ? "—" : String(v); }
    function setStat(id, v) { var el = document.getElementById(id); el.textContent = v; el.classList.add("fade-in"); }
    function badge(status) {
      var c = classify(status);
      var map = { applied: "bg-blue-100 text-blue-700", interview: "bg-amber-100 text-amber-700", offer: "bg-green-100 text-green-700", rejected: "bg-red-100 text-red-700" };
      return "<span class='px-2 py-0.5 rounded-full text-xs " + map[c] + "'>" + fmt(status) + "</span>";
    }

    document.getElementById("refreshBtn").addEventListener("click", loadData);
    loadData();
    setInterval(loadData, REFRESH_MS);

    // ---- Julie chatbot ----
    var panel = document.getElementById("juliePanel");
    document.getElementById("julieToggle").addEventListener("click", function () { panel.classList.toggle("hidden"); });
    function julieMsg(text, who) {
      var log = document.getElementById("julieLog");
      var d = document.createElement("div");
      d.className = who === "user" ? "text-right" : "text-left";
      d.innerHTML = "<span class='inline-block px-3 py-2 rounded-lg " + (who === "user" ? "bg-indigo-600 text-white" : "bg-slate-100") + "'>" + text + "</span>";
      log.appendChild(d); log.scrollTop = log.scrollHeight;
    }
    document.getElementById("julieForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var input = document.getElementById("julieInput");
      var q = input.value.trim(); if (!q) return;
      julieMsg(q, "user"); input.value = "";
      try {
        var res = await fetch(JULIE_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
        var data = await res.json().catch(function () { return {}; });
        julieMsg(data.reply || data.output || "Sorry, I couldn't reach the assistant right now.", "bot");
      } catch (err) { julieMsg("Network error contacting Julie.", "bot"); }
    });
  </script>
<div id="google_translate_element" style="position:fixed; top:10px; right:10px; z-index:70;"></div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'ar,en',
      layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
    }, 'google_translate_element');
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
