<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Live job application dashboard — stats, trends and recent activity." />
  <title>Job Search Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    /* Custom Dark Glassmorphism Styles */
    body {
      background-color: #0f172a;
      background-image: 
        radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
      background-attachment: fixed;
      color: #f1f5f9;
    }
    
    /* Glass Card Utility */
    .glass-panel {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    /* Dark Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    /* Skeleton Animation for Dark Mode */
    .skeleton { 
      background: linear-gradient(90deg, #1e293b 25%, #334155 37%, #1e293b 63%); 
      background-size: 400% 100%; 
      animation: shimmer 1.4s ease infinite; 
    }
    @keyframes shimmer { 0% { background-position: 100% 0 } 100% { background-position: -100% 0 } }
    
    .fade-in { animation: fade .4s ease both } 
    @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

    /* Google Translate Wrapper Glass */
    .glass-translate {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 4px;
    }
  </style>
</head>
<body class="min-h-screen font-sans antialiased selection:bg-[#2563eb] selection:text-white">

  <!-- Navbar -->
  <nav class="glass-panel sticky top-0 z-30 border-b border-white/5">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
        <span class="w-2 h-6 bg-[#2563eb] rounded-full"></span>
        Job Dashboard
      </span>
      <div class="flex gap-1 text-sm font-medium">
        <a href="index.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200">Home</a>
        <a href="dashboard.html" class="px-4 py-2 rounded-lg bg-[#2563eb] text-white shadow-lg shadow-blue-500/20 hover:bg-blue-600 transition-all duration-200">Dashboard</a>
        <a href="cv.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200">Submit CV</a>
      </div>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-8 relative z-10">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-white mb-1">Live Job Stats</h1>
        <p class="text-slate-400 text-sm">Real-time tracking of your application pipeline.</p>
      </div>
      <div class="flex items-center gap-3 text-sm text-slate-400 bg-white/5 px-4 py-2 rounded-full border border-white/5 backdrop-blur-sm">
        <span id="lastUpdated" class="w-24">—</span>
        <button id="refreshBtn" class="px-4 py-1.5 rounded-full bg-[#2563eb] text-white font-medium hover:bg-blue-600 hover:shadow-lg hover:shadow-blue-500/25 transition-all duration-300 active:scale-95 flex items-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          Refresh
        </button>
      </div>
    </div>

    <!-- Stats cards -->
    <section id="statsCards" class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
      <div class="glass-panel rounded-2xl p-6 hover:-translate-y-1 transition-transform duration-300 group">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 group-hover:text-[#2563eb] transition-colors">Total</div>
        <div class="text-3xl font-bold text-white mt-1" id="statTotal"><div class="skeleton h-8 w-16 rounded"></div></div>
      </div>
      <div class="glass-panel rounded-2xl p-6 hover:-translate-y-1 transition-transform duration-300 group">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 group-hover:text-blue-400 transition-colors">Applied</div>
        <div class="text-3xl font-bold text-white mt-1" id="statApplied"><div class="skeleton h-8 w-16 rounded"></div></div>
      </div>
      <div class="glass-panel rounded-2xl p-6 hover:-translate-y-1 transition-transform duration-300 group">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 group-hover:text-amber-400 transition-colors">Interviews</div>
        <div class="text-3xl font-bold text-white mt-1" id="statInterview"><div class="skeleton h-8 w-16 rounded"></div></div>
      </div>
      <div class="glass-panel rounded-2xl p-6 hover:-translate-y-1 transition-transform duration-300 group">
        <div class="text-slate-400 text-xs font-semibold uppercase tracking-wider mb-2 group-hover:text-green-400 transition-colors">Offers</div>
        <div class="text-3xl font-bold text-white mt-1" id="statOffer"><div class="skeleton h-8 w-16 rounded"></div></div>
      </div>
    </section>

    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <!-- Doughnut chart -->
      <section class="glass-panel rounded-2xl p-6 flex flex-col">
        <h2 class="font-semibold text-white mb-6 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-[#2563eb]"></span> Status Breakdown
        </h2>
        <div class="relative flex-1 min-h-[250px] flex items-center justify-center">
          <div id="chartSkeleton" class="skeleton h-64 w-64 rounded-full absolute"></div>
          <div class="relative w-full h-full max-h-[300px]">
            <canvas id="statusChart" class="hidden"></canvas>
          </div>
        </div>
      </section>

      <!-- Recent activity table -->
      <section class="glass-panel rounded-2xl p-6 overflow-hidden flex flex-col">
        <h2 class="font-semibold text-white mb-6 flex items-center gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span> Recent Activity
        </h2>
        <div class="overflow-x-auto flex-1">
          <table class="w-full text-sm">
            <thead>
              <tr class="text-left text-slate-400 border-b border-white/5">
                <th class="py-3 pr-4 font-medium">Date</th>
                <th class="py-3 pr-4 font-medium">Company</th>
                <th class="py-3 pr-4 font-medium">Role</th>
                <th class="py-3 font-medium">Status</th>
              </tr>
            </thead>
            <tbody id="activityBody" class="divide-y divide-white/5">
              <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
              <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
              <tr><td colspan="4"><div class="skeleton h-6 w-full rounded my-2"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
    <p id="errorMsg" class="hidden text-sm text-red-400 mb-6 bg-red-500/10 border border-red-500/20 p-4 rounded-xl"></p>
  </main>

  <!-- Julie chatbot -->
  <div id="julie" class="fixed bottom-6 right-6 z-40">
    <button id="julieToggle" class="bg-[#2563eb] text-white rounded-full w-16 h-16 shadow-2xl shadow-blue-600/30 text-2xl hover:bg-blue-600 hover:scale-105 transition-all duration-300 flex items-center justify-center border border-white/10">
      💬
    </button>
    <div id="juliePanel" class="hidden w-80 md:w-96 glass-panel rounded-2xl shadow-2xl mt-4 flex flex-col overflow-hidden border border-white/10 absolute bottom-20 right-0 origin-bottom-right transition-all duration-300 transform scale-95 opacity-0" style="height:480px">
      <div class="bg-gradient-to-r from-[#2563eb] to-blue-700 text-white px-5 py-4 flex justify-between items-center shadow-lg">
        <div class="font-semibold flex items-center gap-2">
          <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
          Julie · Job Assistant
        </div>
        <button id="julieClose" class="text-blue-100 hover:text-white">&times;</button>
      </div>
      <div id="julieLog" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm bg-slate-900/40"></div>
      <form id="julieForm" class="p-4 bg-slate-900/60 border-t border-white/5 flex gap-2">
        <input id="julieInput" class="flex-1 bg-slate-800/50 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-[#2563eb] focus:ring-1 focus:ring-[#2563eb] transition-all" placeholder="Ask Julie about your stats..." autocomplete="off" />
        <button class="bg-[#2563eb] text-white px-4 rounded-xl text-sm font-medium hover:bg-blue-600 transition-colors">Send</button>
      </form>
    </div>
  </div>

  <!-- Google Translate Widget -->
  <div class="fixed top-4 right-4 z-50 glass-translate">
    <div id="google_translate_element"></div>
  </div>

  <script>
    // ---- Config ----
    var SHEET_ID = "1rivD5luGlZqq6MCEUVvlT263OfUKXrzH6cr9cf0nG3A";
    var SHEET_NAME = "Job Applications Log";
    var JULIE_ENDPOINT = "https://hsndm566.app.n8n.cloud/webhook/julie-chat";
    var REFRESH_MS = 60000;
    var chart;

    function gvizUrl() {
      return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
        "/gviz/tq?sheet=" + encodeURIComponent(SHEET_NAME) + "&tqx=out:json";
    }
    function parseGviz(text) {
      var start = text.indexOf("{");
      var end = text.lastIndexOf("}");
      var obj = JSON.parse(text.substring(start, end + 1));
      var cols = obj.table.cols.map(function (c) { return (c.label || c.id || "").toString().trim(); });
      return obj.table.rows.map(function (r) {
        var o = {};
        (r.c || []).forEach(function (cell, i) { o[cols[i] || ("col" + i)] = cell ? cell.v : null; });
        return o;
      });
    }
    function pick(row, names) {
      var keys = Object.keys(row);
      for (var n = 0; n < names.length; n++) {
        for (var k = 0; k < keys.length; k++) {
          if (keys[k].toLowerCase().indexOf(names[n]) !== -1) return row[keys[k]];
        }
      }
      return "";
    }
    function classify(status) {
      var s = (status || "").toString().toLowerCase();
      if (s.indexOf("offer") !== -1) return "offer";
      if (s.indexOf("interview") !== -1) return "interview";
      if (s.indexOf("reject") !== -1) return "rejected";
      return "applied";
    }

    async function loadData() {
      document.getElementById("errorMsg").classList.add("hidden");
      try {
        var res = await fetch(gvizUrl());
        var text = await res.text();
        var rows = parseGviz(text);
        render(rows);
        document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
      } catch (e) {
        var em = document.getElementById("errorMsg");
        em.textContent = "Could not load the sheet. Make sure it is shared as 'Anyone with the link can view'. (" + e.message + ")";
        em.classList.remove("hidden");
      }
    }

    function render(rows) {
      var counts = { applied: 0, interview: 0, offer: 0, rejected: 0 };
      rows.forEach(function (r) { counts[classify(pick(r, ["status"]))]++; });

      setStat("statTotal", rows.length);
      setStat("statApplied", counts.applied);
      setStat("statInterview", counts.interview);
      setStat("statOffer", counts.offer);

      // Chart
      document.getElementById("chartSkeleton").classList.add("hidden");
      var canvas = document.getElementById("statusChart");
      canvas.classList.remove("hidden");
      var data = {
        labels: ["Applied", "Interview", "Offer", "Rejected"],
        datasets: [{ data: [counts.applied, counts.interview, counts.offer, counts.rejected],
          backgroundColor: ["#3b82f6", "#f59e0b", "#22c55e", "#ef4444"],
          borderColor: "#1e293b",
          borderWidth: 2,
          hoverOffset: 4 }]
      };
      
      // Dark mode chart options
      var chartOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { 
            position: "bottom",
            labels: { color: "#cbd5e1", padding: 20, font: { family: "sans-serif" } }
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.9)",
            titleColor: "#fff",
            bodyColor: "#cbd5e1",
            borderColor: "rgba(255,255,255,0.1)",
            borderWidth: 1,
            padding: 12,
            displayColors: true
          }
        },
        cutout: '70%'
      };

      if (chart) { chart.data = data; chart.update(); }
      else { chart = new Chart(canvas, { type: "doughnut", data: data, options: chartOptions }); }

      // Recent activity (last 8)
      var body = document.getElementById("activityBody");
      body.innerHTML = "";
      var recent = rows.slice(-8).reverse();
      if (!recent.length) { body.innerHTML = '<tr><td colspan="4" class="py-4 text-slate-500 text-center">No records yet.</td></tr>'; return; }
      recent.forEach(function (r) {
        var tr = document.createElement("tr");
        tr.className = "border-b border-white/5 last:border-0 hover:bg-white/5 transition-colors fade-in";
        tr.innerHTML = "<td class='py-3 pr-4 text-slate-400'>" + fmt(pick(r, ["date", "applied"])) + "</td>" +
          "<td class='py-3 pr-4 font-medium text-slate-200'>" + fmt(pick(r, ["company", "employer"])) + "</td>" +
          "<td class='py-3 pr-4 text-slate-300'>" + fmt(pick(r, ["role", "position", "title"])) + "</td>" +
          "<td class='py-3'>" + badge(pick(r, ["status"])) + "</td>";
        body.appendChild(tr);
      });
    }
    function fmt(v) { return v == null || v === "" ? "—" : String(v); }
    function setStat(id, v) { var el = document.getElementById(id); el.textContent = v; el.classList.add("fade-in"); }
    function badge(status) {
      var c = classify(status);
      // Dark mode badge styles
      var map = { 
        applied: "bg-blue-500/10 text-blue-300 border border-blue-500/20", 
        interview: "bg-amber-500/10 text-amber-300 border border-amber-500/20", 
        offer: "bg-green-500/10 text-green-300 border border-green-500/20", 
        rejected: "bg-red-500/10 text-red-300 border border-red-500/20" 
      };
      return "<span class='px-2.5 py-1 rounded-lg text-xs font-semibold " + map[c] + "'>" + fmt(status) + "</span>";
    }

    document.getElementById("refreshBtn").addEventListener("click", loadData);
    loadData();
    setInterval(loadData, REFRESH_MS);

    // ---- Julie chatbot ----
    var panel = document.getElementById("juliePanel");
    var toggleBtn = document.getElementById("julieToggle");
    var closeBtn = document.getElementById("julieClose");
    
    function toggleJulie() {
      var isHidden = panel.classList.contains("hidden");
      if (isHidden) {
        panel.classList.remove("hidden");
        // Small delay to allow display:block to apply before opacity transition
        setTimeout(() => {
          panel.classList.remove("scale-95", "opacity-0");
          panel.classList.add("scale-100", "opacity-100");
        }, 10);
      } else {
        panel.classList.remove("scale-100", "opacity-100");
        panel.classList.add("scale-95", "opacity-0");
        setTimeout(() => {
          panel.classList.add("hidden");
        }, 300);
      }
    }

    toggleBtn.addEventListener("click", toggleJulie);
    closeBtn.addEventListener("click", toggleJulie);

    function julieMsg(text, who) {
      var log = document.getElementById("julieLog");
      var d = document.createElement("div");
      d.className = who === "user" ? "text-right" : "text-left";
      var bubbleClass = who === "user" 
        ? "bg-[#2563eb] text-white rounded-2xl rounded-tr-sm shadow-lg shadow-blue-900/20" 
        : "bg-slate-700/50 text-slate-200 rounded-2xl rounded-tl-sm border border-white/5";
      d.innerHTML = "<span class='inline-block px-4 py-2.5 max-w-[85%] text-sm leading-relaxed " + bubbleClass + "'>" + text + "</span>";
      log.appendChild(d); log.scrollTop = log.scrollHeight;
    }
    document.getElementById("julieForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var input = document.getElementById("julieInput");
      var q = input.value.trim(); if (!q) return;
      julieMsg(q, "user"); input.value = "";
      try {
        var res = await fetch(JULIE_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
        var data = await res.json().catch(function () { return {}; });
        julieMsg(data.reply || data.output || "Sorry, I couldn't reach the assistant right now.", "bot");
      } catch (err) { julieMsg("Network error contacting Julie.", "bot"); }
    });
  </script>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'ar,en',
      layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
    }, 'google_translate_element');
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
