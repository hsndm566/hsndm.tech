name: AutoApply SA weekly uptime summary

on:
  schedule:
    # Monday 09:00 Saudi Arabia time (06:00 UTC).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  issues: write

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the weekly uptime report
        uses: actions/github-script@v7
        env:
          REPORT_ASSIGNEE: hsndm566
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const now = new Date();
            const since = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'uptime-monitor.yml',
              per_page: 100,
            });
            const completedRuns = runs.filter((run) =>
              run.status === 'completed' && new Date(run.created_at) >= since
            );
            const passing = completedRuns.filter((run) => run.conclusion === 'success').length;
            const failing = completedRuns.filter((run) => run.conclusion === 'failure').length;
            const interrupted = completedRuns.length - passing - failing;
            const uptimeRate = completedRuns.length
              ? `${((passing / completedRuns.length) * 100).toFixed(2)}%`
              : 'No scheduled checks completed in this period';

            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const metricRecords = [];
            for (const run of completedRuns) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = artifacts.find((item) => item.name === 'uptime-metrics' && !item.expired);
              if (!artifact) continue;

              const workDir = fs.mkdtempSync(path.join(os.tmpdir(), 'uptime-metrics-'));
              const archivePath = path.join(workDir, 'metrics.zip');
              try {
                const response = await fetch(artifact.archive_download_url, {
                  headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}` },
                });
                if (!response.ok) throw new Error(`Artifact download returned ${response.status}`);
                fs.writeFileSync(archivePath, Buffer.from(await response.arrayBuffer()));
                const raw = execFileSync('unzip', ['-p', archivePath, 'uptime-metrics.json'], { encoding: 'utf8' });
                metricRecords.push(JSON.parse(raw));
              } catch (error) {
                core.warning(`Unable to read metrics for monitor run ${run.id}: ${error.message}`);
              } finally {
                fs.rmSync(workDir, { recursive: true, force: true });
              }
            }

            const routeMeasurements = metricRecords.flatMap((record) => record.routes || []);
            const validTimings = routeMeasurements
              .filter((route) => route.outcome === 'pass' && Number.isFinite(route.response_seconds) && route.response_seconds > 0)
              .map((route) => route.response_seconds)
              .sort((a, b) => a - b);
            const percentile = (values, p) => values.length ? values[Math.min(values.length - 1, Math.ceil(values.length * p) - 1)] : null;
            const mean = validTimings.length ? validTimings.reduce((total, value) => total + value, 0) / validTimings.length : null;
            const routeFailures = routeMeasurements.filter((route) => route.outcome !== 'pass').length;
            const errorRate = routeMeasurements.length ? `${((routeFailures / routeMeasurements.length) * 100).toFixed(2)}%` : 'Not yet available';
            const slowestRoute = Object.values(routeMeasurements.reduce((groups, route) => {
              if (route.outcome !== 'pass' || !Number.isFinite(route.response_seconds) || route.response_seconds <= 0) return groups;
              groups[route.label] ||= { label: route.label, total: 0, count: 0 };
              groups[route.label].total += route.response_seconds;
              groups[route.label].count += 1;
              return groups;
            }, {})).sort((a, b) => (b.total / b.count) - (a.total / a.count))[0];
            const seconds = (value) => value === null || value === undefined ? 'Not yet available' : `${value.toFixed(3)}s`;
            const title = `[AutoApply SA Weekly] Uptime summary — ${now.toISOString().slice(0, 10)}`;
            const body = [
              '## Weekly uptime summary',
              '',
              `**Period:** ${since.toISOString().slice(0, 10)} to ${now.toISOString().slice(0, 10)} (UTC)`,
              '',
              '| Metric | Result |',
              '| --- | --- |',
              `| Completed health-check runs | ${completedRuns.length} |`,
              `| Passing runs | ${passing} |`,
              `| Failed runs | ${failing} |`,
              `| Interrupted or cancelled runs | ${interrupted} |`,
              `| Uptime rate | ${uptimeRate} |`,
              `| Route-level measurements captured | ${routeMeasurements.length} |`,
              `| Route-level error rate | ${errorRate} |`,
              `| Average successful response time | ${seconds(mean)} |`,
              `| Median successful response time | ${seconds(percentile(validTimings, 0.5))} |`,
              `| P95 successful response time | ${seconds(percentile(validTimings, 0.95))} |`,
              `| Slowest route by average response time | ${slowestRoute ? `${slowestRoute.label} (${seconds(slowestRoute.total / slowestRoute.count)})` : 'Not yet available'} |`,
              '',
              'A passing run confirms that the homepage, campaign enquiry page, Arabic page, thank-you page, crawl files, and hero media passed availability and response-time checks. The response-time metrics are synthetic checks from the automated runner, so they indicate service responsiveness rather than a visitor’s mobile rendering experience. A failed run opens or updates the separate immediate `uptime-alert` issue.',
              '',
              `[View the uptime monitor history](${context.serverUrl}/${owner}/${repo}/actions/workflows/uptime-monitor.yml)`,
            ].join('\n');

            const report = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['uptime-summary'],
              assignees: [process.env.REPORT_ASSIGNEE],
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: report.data.number,
              state: 'closed',
            });
