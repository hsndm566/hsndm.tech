name: AutoApply SA uptime monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public routes and hero media
        id: health
        shell: bash
        run: |
          set -uo pipefail
          targets=(
            "Homepage|https://hsndm.tech/|GET"
            "Campaign enquiry|https://hsndm.tech/enquire|GET"
            "Arabic landing page|https://hsndm.tech/ar|GET"
            "Thank-you page|https://hsndm.tech/thank-you|GET"
            "Robots file|https://hsndm.tech/robots.txt|GET"
            "Sitemap|https://hsndm.tech/sitemap.xml|GET"
            "Hero media|https://hsndm.tech/manus-storage/autoapply-sa-hero-loop_52bacf1a.mp4|HEAD"
          )

          failures=()
          for target in "${targets[@]}"; do
            IFS='|' read -r label url method <<< "$target"
            if [[ "$method" == "HEAD" ]]; then
              response=$(curl --location --head --silent --show-error --connect-timeout 12 --max-time 30 --write-out " %{http_code} %{time_total}" --output /dev/null "$url" 2>&1) || response="curl_failed"
            else
              response=$(curl --location --silent --show-error --connect-timeout 12 --max-time 30 --write-out " %{http_code} %{time_total}" --output /dev/null "$url" 2>&1) || response="curl_failed"
            fi

            code=$(awk '{print $(NF-1)}' <<< "$response")
            duration=$(awk '{print $NF}' <<< "$response")
            if [[ "$code" != "200" ]]; then
              failures+=("$label — expected HTTP 200, received: $response")
            elif [[ "$duration" =~ ^[0-9]+(\.[0-9]+)?$ ]] && awk "BEGIN { exit !($duration > 20) }"; then
              failures+=("$label — HTTP 200 but slow response: ${duration}s")
            else
              echo "$label healthy: HTTP $code in ${duration}s"
            fi
          done

          if (( ${#failures[@]} > 0 )); then
            printf '%s\n' "${failures[@]}" > monitor-failure.md
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or close the assigned alert issue
        if: always()
        uses: actions/github-script@v7
        env:
          FAILED: ${{ steps.health.outputs.failed }}
          ALERT_ASSIGNEE: hsndm566
        with:
          script: |
            const title = '[AutoApply SA Monitor] Website health check failed';
            const { owner, repo } = context.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'uptime-alert',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            const failed = process.env.FAILED === 'true';

            if (failed) {
              const fs = require('fs');
              const detail = fs.existsSync('monitor-failure.md')
                ? fs.readFileSync('monitor-failure.md', 'utf8')
                : 'The health-check process did not complete. Review the workflow run.';
              const body = `Automated health check detected a problem at ${new Date().toISOString()}.\n\n${detail}\n\n[Open the workflow run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})`;

              if (existing) {
                await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
              } else {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: ['uptime-alert'],
                  assignees: [process.env.ALERT_ASSIGNEE],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Recovered: the scheduled health check passed at ${new Date().toISOString()}.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
