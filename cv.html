<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Submit your CV for a target role and get it into the pipeline." />
  <title>Submit Your CV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in { animation: fade .4s ease both } @keyframes fade { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
    .checkmark { stroke-dasharray: 48; stroke-dashoffset: 48; animation: draw .6s ease .1s forwards }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .pop { animation: pop .4s cubic-bezier(.2,.8,.2,1) both } @keyframes pop { from { transform: scale(.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 40% 20%, rgba(37, 99, 235, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 1;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    
    .glass-light {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.25);
    }
    
    .glass-dark {
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }
    
    .accent-glow {
      box-shadow: 0 0 20px rgba(37, 99, 235, 0.3);
    }
    
    .input-glass {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }
    
    .input-glass:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }
    
    .btn-glass {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    .btn-glass::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .btn-glass:hover::before {
      left: 100%;
    }
    
    .btn-glass:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.4);
    }
    
    .nav-link {
      transition: all 0.3s ease;
      position: relative;
    }
    
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 50%;
      width: 0;
      height: 2px;
      background: #2563eb;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }
    
    .nav-link:hover::after {
      width: 80%;
    }
    
    .chat-bubble {
      animation: slideUp 0.3s ease;
    }
    
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .success-glow {
      animation: glowPulse 2s ease infinite;
    }
    
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.3); }
      50% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.5); }
    }
    
    #google_translate_element {
      filter: invert(1) hue-rotate(180deg);
    }
    
    #google_translate_element .goog-te-gadget {
      background: transparent !important;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen relative">
  <nav class="glass-dark sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <span class="font-bold text-lg flex items-center gap-2">
        <span class="text-2xl">📄</span>
        <span class="bg-gradient-to-r from-blue-400 to-blue-600 bg-clip-text text-transparent">Submit CV</span>
      </span>
      <div class="flex gap-2 text-sm">
        <a href="index.html" class="nav-link px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all">Home</a>
        <a href="dashboard.html" class="nav-link px-3 py-1.5 rounded-lg hover:bg-white/10 transition-all">Dashboard</a>
        <a href="cv.html" class="px-3 py-1.5 rounded-lg bg-gradient-to-r from-blue-500 to-blue-600 text-white font-medium shadow-lg">Submit CV</a>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 py-10 relative z-10">
    <div class="text-center mb-8 fade-in">
      <h1 class="text-4xl font-bold mb-3 bg-gradient-to-r from-blue-400 via-blue-500 to-blue-600 bg-clip-text text-transparent">Submit your CV</h1>
      <p class="text-gray-400 text-lg">Paste your CV, tell us the role you're targeting, and we'll take it from there.</p>
    </div>

    <form id="cvForm" class="glass rounded-2xl p-8 space-y-6 fade-in">
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-300 mb-2" for="target_role">Target role</label>
        <input id="target_role" name="target_role" required class="input-glass w-full rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 outline-none" placeholder="e.g. Senior Frontend Engineer" />
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-300 mb-2" for="email">Email</label>
        <input id="email" name="email" type="email" required class="input-glass w-full rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 outline-none" placeholder="you@example.com" />
      </div>
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-300 mb-2" for="cv_text">CV text</label>
        <textarea id="cv_text" name="cv_text" required rows="10" class="input-glass w-full rounded-lg px-4 py-3 text-gray-100 placeholder-gray-500 outline-none resize-none" placeholder="Paste your CV here…"></textarea>
      </div>
      <button id="submitBtn" type="submit" class="btn-glass w-full text-white font-semibold py-3.5 rounded-lg text-lg disabled:opacity-60 disabled:cursor-not-allowed">
        Submit CV
      </button>
      <p id="formError" class="hidden text-sm text-red-400 bg-red-900/20 border border-red-500/30 rounded-lg px-4 py-2"></p>
    </form>

    <!-- Success animation -->
    <div id="successCard" class="hidden glass rounded-2xl p-12 text-center pop success-glow">
      <svg class="mx-auto mb-6" width="80" height="80" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="25" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.8" />
        <path class="checkmark" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round" d="M14 27 l8 8 l16 -16" />
      </svg>
      <h2 class="text-2xl font-bold mb-2 bg-gradient-to-r from-green-400 to-green-600 bg-clip-text text-transparent">CV submitted!</h2>
      <p class="text-gray-400 mb-8">Thanks — we've received your CV and will be in touch.</p>
      <div class="flex gap-4 justify-center">
        <a href="dashboard.html" class="px-6 py-3 rounded-lg bg-gradient-to-r from-blue-500 to-blue-600 text-white font-medium hover:shadow-xl transition-all transform hover:-translate-y-1">View Dashboard</a>
        <button id="againBtn" class="px-6 py-3 rounded-lg glass-light hover:bg-white/10 transition-all font-medium">Submit another</button>
      </div>
    </div>
  </main>

  <!-- Julie chatbot -->
  <div id="julie" class="fixed bottom-6 right-6 z-40">
    <button id="julieToggle" class="bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-full w-16 h-16 shadow-2xl text-2xl hover:shadow-blue-500/50 transition-all transform hover:scale-110 flex items-center justify-center">💬</button>
    <div id="juliePanel" class="hidden w-96 glass rounded-2xl shadow-2xl mt-3 flex flex-col" style="height:460px">
      <div class="bg-gradient-to-r from-blue-500 to-blue-600 text-white px-5 py-4 rounded-t-2xl font-semibold flex items-center gap-2">
        <span class="text-xl">🤖</span>
        Julie · Job Assistant
      </div>
      <div id="julieLog" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
      <form id="julieForm" class="p-4 border-t border-white/10 flex gap-2">
        <input id="julieInput" class="input-glass flex-1 rounded-lg px-4 py-2.5 text-sm text-gray-100 placeholder-gray-500 outline-none" placeholder="Ask Julie…" autocomplete="off" />
        <button class="btn-glass text-white px-5 rounded-lg text-sm font-medium">Send</button>
      </form>
    </div>
  </div>

  <script>
    var SUBMIT_ENDPOINT = "https://hsndm566.app.n8n.cloud/webhook/submit-cv";
    var JULIE_ENDPOINT = "https://hsndm566.app.n8n.cloud/webhook/julie-chat";

    document.getElementById("cvForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var err = document.getElementById("formError"); err.classList.add("hidden");
      var btn = document.getElementById("submitBtn"); btn.disabled = true; btn.textContent = "Submitting…";
      var payload = {
        cv_text: document.getElementById("cv_text").value,
        target_role: document.getElementById("target_role").value,
        email: document.getElementById("email").value
      };
      try {
        var res = await fetch(SUBMIT_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error("Server responded " + res.status);
        document.getElementById("cvForm").classList.add("hidden");
        document.getElementById("successCard").classList.remove("hidden");
      } catch (e2) {
        err.textContent = "Submission failed: " + e2.message + ". Please try again.";
        err.classList.remove("hidden");
      } finally { btn.disabled = false; btn.textContent = "Submit CV"; }
    });
    document.getElementById("againBtn").addEventListener("click", function () {
      document.getElementById("successCard").classList.add("hidden");
      document.getElementById("cvForm").reset();
      document.getElementById("cvForm").classList.remove("hidden");
    });

    // ---- Julie chatbot ----
    var panel = document.getElementById("juliePanel");
    document.getElementById("julieToggle").addEventListener("click", function () { panel.classList.toggle("hidden"); });
    function julieMsg(text, who) {
      var log = document.getElementById("julieLog");
      var d = document.createElement("div");
      d.className = who === "user" ? "text-right" : "text-left";
      d.innerHTML = "<span class='chat-bubble inline-block px-4 py-2.5 rounded-2xl " + (who === "user" ? "bg-gradient-to-r from-blue-500 to-blue-600 text-white" : "glass-light text-gray-100") + "'>" + text + "</span>";
      log.appendChild(d); log.scrollTop = log.scrollHeight;
    }
    document.getElementById("julieForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      var input = document.getElementById("julieInput");
      var q = input.value.trim(); if (!q) return;
      julieMsg(q, "user"); input.value = "";
      try {
        var res = await fetch(JULIE_ENDPOINT, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q }) });
        var data = await res.json().catch(function () { return {}; });
        julieMsg(data.reply || data.output || "Sorry, I couldn't reach the assistant right now.", "bot");
      } catch (err) { julieMsg("Network error contacting Julie.", "bot"); }
    });
  </script>
<div id="google_translate_element" style="position:fixed; top:10px; right:10px; z-index:70;"></div>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'ar,en',
      layout: google.translate.TranslateElement.InlineLayout.HORIZONTAL
    }, 'google_translate_element');
  }
</script>
<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
