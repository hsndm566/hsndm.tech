<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hasan Adam – Industrial Engineer & Job Application Dashboard</title>
<meta name="description" content="Hasan Adam – Industrial Engineer, automation builder, and live job-application tracker.">
<meta name="theme-color" content="#0a0e17">

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: { accent: '#2563eb', accent2: '#3b82f6' },
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
          display: ['"Space Grotesk"', 'Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        }
      }
    }
  }
</script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  :root{
    --bg:#0a0e17;
    --bg-elevated:rgba(18,24,38,0.72);
    --bg-elevated-solid:#121826;
    --bg-elevated-2:#1a2233;
    --border:rgba(38,47,66,0.8);
    --border-solid:#262f42;
    --text:#e8ecf3;
    --text-dim:#8b95a8;
    --text-faint:#565f70;
    --accent:#2563eb;
    --accent-2:#3b82f6;
    --accent-glow:#60a5fa;
    --accent-rgb:37,99,235;
    --green:#22c55e;
    --red:#ef4444;
    --yellow:#eab308;
    --shadow: 0 8px 28px rgba(0,0,0,0.45);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
    --radius: 18px;
    --radius-lg: 24px;
    --sidebar-w: 260px;
    --mx: 50%;
    --my: 30%;
  }

  [data-theme="light"]{
    --bg:#f5f7fb;
    --bg-elevated:rgba(255,255,255,0.75);
    --bg-elevated-solid:#ffffff;
    --bg-elevated-2:#eef2f8;
    --border:rgba(223,230,240,0.9);
    --border-solid:#dfe6f0;
    --text:#0f172a;
    --text-dim:#57647a;
    --text-faint:#94a3b8;
    --accent:#2563eb;
    --accent-2:#1d4ed8;
    --accent-glow:#3b82f6;
    --accent-rgb:37,99,235;
    --green:#16a34a;
    --red:#dc2626;
    --yellow:#ca8a04;
    --shadow: 0 8px 28px rgba(100,116,139,0.18);
    --shadow-lg: 0 24px 60px rgba(100,116,139,0.25);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:background .5s ease, color .5s ease;
    overflow-x:hidden;
    position:relative;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    letter-spacing:-0.011em;
    line-height:1.6;
  }
  .font-heading{font-family:'Space Grotesk', 'Inter', sans-serif;letter-spacing:-0.03em;}
  .font-num{font-family:'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-solid);border-radius:8px;border:2px solid var(--bg);}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  ::selection{background:rgba(var(--accent-rgb),0.35);color:var(--text);}

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:8px;
  }
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  /* ---------- Gradient text ---------- */
  .gradient-text{
    background:linear-gradient(135deg, #60a5fa 0%, #2563eb 50%, #a855f7 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    display:inline-block;
    background-size:200% 200%;
    animation:gradientShift 8s ease infinite;
  }
  @keyframes gradientShift{
    0%,100%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
  }

  /* ---------- Ambient background ---------- */
  .ambient-bg{
    position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;
  }
  .ambient-blob{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.32;
    animation:drift 22s ease-in-out infinite;
  }
  .ambient-blob.b1{width:520px;height:520px;background:var(--accent);top:-140px;left:-120px;animation-delay:0s;}
  .ambient-blob.b2{width:440px;height:440px;background:#a855f7;bottom:-160px;right:-100px;animation-delay:-8s;}
  .ambient-blob.b3{width:360px;height:360px;background:#22c55e;bottom:20%;left:35%;animation-delay:-14s;opacity:.15;}
  [data-theme="light"] .ambient-blob{opacity:.14;}

  .ambient-bg::after{
    content:'';
    position:absolute;inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
    opacity:.035;
    mix-blend-mode:overlay;
  }

  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    33%{transform:translate(50px,-40px) scale(1.1);}
    66%{transform:translate(-40px,30px) scale(0.92);}
  }

  @media (prefers-reduced-motion: reduce){
    .ambient-blob,.gradient-text{animation:none;}
    *{scroll-behavior:auto !important;}
  }

  /* ---------- Glass cards ---------- */
  .glass-card{
    background:var(--bg-elevated);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid var(--border);
    border-radius:var(--radius);
    transition:transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease, border-color .3s ease, background .3s ease;
    will-change:transform;
    position:relative;
    overflow:hidden;
  }
  .glass-card::before{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.06) 0%, transparent 50%);
    pointer-events:none;
    opacity:.8;
    transition:opacity .3s ease;
  }
  [data-theme="light"] .glass-card::before{
    background:linear-gradient(135deg, rgba(255,255,255,0.8) 0%, transparent 60%);
  }
  .glass-card:hover{
    transform:translateY(-4px);
    box-shadow:0 0 0 1px rgba(var(--accent-rgb),0.4), 0 24px 50px rgba(var(--accent-rgb),0.22);
    border-color:rgba(var(--accent-rgb),0.55);
  }
  .glass-card:hover::before{opacity:1;}

  .glass-flat{
    background:var(--bg-elevated);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--border);
    border-radius:var(--radius);
  }

  .fade-in{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.8,.2,1), transform .8s cubic-bezier(.2,.8,.2,1);}
  .fade-in.visible{opacity:1;transform:translateY(0);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:var(--sidebar-w);
    background:var(--bg-elevated);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-right:1px solid var(--border);
    transition:transform .45s cubic-bezier(.4,0,.2,1), background .3s ease, border-color .3s ease;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand-badge{
    display:flex;align-items:center;gap:12px;
    padding:6px 4px;
  }
  .brand-avatar{
    width:44px;height:44px;border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent-glow));
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:15px;
    box-shadow:0 6px 18px rgba(var(--accent-rgb),0.4);
    position:relative;
  }
  .brand-avatar::after{
    content:'';
    position:absolute;inset:-2px;
    border-radius:14px;
    background:linear-gradient(135deg, var(--accent), transparent, var(--accent-glow));
    z-index:-1;
    opacity:.5;
  }
  .nav-link{
    color:var(--text-dim);
    transition:background .25s ease, color .25s ease, transform .25s ease;
    position:relative;
  }
  .nav-link::before{
    content:'';
    position:absolute;
    left:0;top:50%;transform:translateY(-50%);
    width:3px;height:0;
    background:linear-gradient(180deg, var(--accent), var(--accent-glow));
    border-radius:0 3px 3px 0;
    transition:height .3s ease;
  }
  .nav-link:hover{background:var(--bg-elevated-2);color:var(--text);transform:translateX(4px);}
  .nav-link.active{
    background:rgba(var(--accent-rgb),0.12);
    color:var(--accent);
    font-weight:600;
  }
  .nav-link.active::before{height:60%;}

  .overlay{
    background:rgba(0,0,0,0.6);
    backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  @media (max-width: 1023px){
    .sidebar{
      position:fixed;inset:0;
      width:100%;
      height:100vh;
      transform:translateY(-100%);
      z-index:100;
      display:flex;
      justify-content:center;
      align-items:center;
    }
    .sidebar.open{transform:translateY(0);}
    .sidebar .nav-links-mobile{width:100%;max-width:340px;padding:2rem;}
    .sidebar ul li{
      opacity:0;
      transform:translateY(16px);
      transition:opacity .4s ease, transform .4s ease;
    }
    .sidebar.open ul li{opacity:1;transform:translateY(0);}
    .sidebar.open ul li:nth-child(1){transition-delay:.08s;}
    .sidebar.open ul li:nth-child(2){transition-delay:.13s;}
    .sidebar.open ul li:nth-child(3){transition-delay:.18s;}
    .sidebar.open ul li:nth-child(4){transition-delay:.23s;}
    .sidebar.open ul li:nth-child(5){transition-delay:.28s;}
    .nav-link{justify-content:center;font-size:1.1rem;padding:1rem 1.2rem;}
  }

  /* ---------- Status pills ---------- */
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:3px 10px;border-radius:999px;
    font-size:.72rem;font-weight:600;
    text-transform:capitalize;
    border:1px solid transparent;
  }
  .status-pill::before{
    content:'';width:6px;height:6px;border-radius:50%;
  }
  .status-sent{color:var(--green);background:rgba(34,197,94,0.1);border-color:rgba(34,197,94,0.25);}
  .status-sent::before{background:var(--green);box-shadow:0 0 8px var(--green);}
  .status-failed{color:var(--red);background:rgba(239,68,68,0.1);border-color:rgba(239,68,68,0.25);}
  .status-failed::before{background:var(--red);}
  .status-interview_invite{color:var(--yellow);background:rgba(234,179,8,0.1);border-color:rgba(234,179,8,0.25);}
  .status-interview_invite::before{background:var(--yellow);box-shadow:0 0 8px var(--yellow);}
  .status-unknown{color:var(--text-dim);background:var(--bg-elevated-2);border-color:var(--border-solid);}
  .status-unknown::before{background:var(--text-dim);}

  /* ---------- Skill chips ---------- */
  .skill-chip{
    background:var(--bg-elevated);
    backdrop-filter:blur(10px);
    border:1px solid var(--border);
    transition:transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s ease, box-shadow .3s ease, background .3s ease;
    cursor:default;
  }
  .skill-chip:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 12px 24px rgba(var(--accent-rgb),0.2);
  }
  .skill-chip i{color:var(--accent);transition:transform .3s ease;}
  .skill-chip:hover i{transform:scale(1.15) rotate(-5deg);}

  /* ---------- Projects ---------- */
  .project-icon{
    background:linear-gradient(135deg, rgba(var(--accent-rgb),0.18), rgba(var(--accent-rgb),0.08));
    color:var(--accent);
    border:1px solid rgba(var(--accent-rgb),0.2);
    transition:transform .3s ease;
  }
  .glass-card:hover .project-icon{transform:scale(1.08) rotate(-4deg);}
  .project-tags span{
    background:var(--bg-elevated-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    font-weight:500;
    transition:border-color .2s ease, color .2s ease;
  }
  .project-tags span:hover{border-color:var(--accent);color:var(--accent);}

  /* ---------- Buttons ---------- */
  .btn-primary{
    background:linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    box-shadow:0 8px 20px rgba(var(--accent-rgb),0.35);
  }
  .btn-primary:hover{
    box-shadow:0 14px 32px rgba(var(--accent-rgb),0.55);
    transform:translateY(-2px);
  }
  .btn-outline{
    border:1px solid var(--border-solid);
    color:var(--text);
    background:var(--bg-elevated);
    backdrop-filter:blur(10px);
  }
  .btn-outline:hover{
    border-color:var(--accent);
    color:var(--accent);
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(var(--accent-rgb),0.15);
  }
  .btn-primary,.btn-outline,.glass-flat button, #refreshBtn, #themeToggle{
    position:relative;overflow:hidden;
    transition:transform .2s ease, background .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
  }
  .btn-primary:active,.btn-outline:active{transform:scale(.97);}
  .ripple{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.5);
    transform:scale(0);
    animation:rippleAnim .65s ease-out;
    pointer-events:none;
  }
  [data-theme="light"] .ripple{background:rgba(37,99,235,0.28);}
  @keyframes rippleAnim{
    to{transform:scale(2.8);opacity:0;}
  }

  /* ---------- Hero ---------- */
  .hero-glow-wrap{position:relative;}
  .hero-glow{
    position:absolute;
    top:-140px;left:-100px;
    width:480px;height:480px;
    background:radial-gradient(circle, rgba(var(--accent-rgb),0.4) 0%, rgba(var(--accent-rgb),0.14) 45%, rgba(var(--accent-rgb),0) 70%);
    filter:blur(50px);
    pointer-events:none;
    z-index:0;
  }
  .hero-content{position:relative;z-index:2;}

  .hero-spotlight{
    position:absolute;inset:0;
    background:radial-gradient(500px circle at var(--mx) var(--my), rgba(var(--accent-rgb),0.16), transparent 60%);
    pointer-events:none;
    z-index:1;
    transition:opacity .3s ease;
  }

  #dotGrid{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.75;}

  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 14px;border-radius:999px;
    background:rgba(var(--accent-rgb),0.1);
    border:1px solid rgba(var(--accent-rgb),0.25);
    color:var(--accent);
    font-size:.75rem;font-weight:600;
    text-transform:uppercase;letter-spacing:.08em;
    margin-bottom:20px;
    backdrop-filter:blur(10px);
  }
  .hero-eyebrow .live-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1;transform:scale(1);}
    50%{opacity:.6;transform:scale(1.3);}
  }

  .typing-cursor{
    display:inline-block;
    width:3px;
    background:var(--accent);
    margin-left:2px;
    animation:blink 1s step-end infinite;
    border-radius:2px;
  }
  @keyframes blink{50%{opacity:0;}}

  .avatar-circle{
    position:relative;
    transition:transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s ease;
  }
  .avatar-circle::after{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:linear-gradient(135deg, var(--accent), transparent, var(--accent-glow));
    z-index:-1;
    opacity:0;
    transition:opacity .4s ease;
  }
  .avatar-circle:hover{
    transform:scale(1.07) rotate(4deg);
    box-shadow:0 0 0 6px rgba(var(--accent-rgb),0.2), 0 0 50px rgba(var(--accent-rgb),0.4);
  }
  .avatar-circle:hover::after{opacity:1;}

  /* ---------- Section headings ---------- */
  .section-num{
    font-size:.8rem;
    color:var(--accent);
    padding:3px 12px;
    border-radius:999px;
    background:rgba(var(--accent-rgb),0.1);
    border:1px solid rgba(var(--accent-rgb),0.25);
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    letter-spacing:.05em;
  }
  .section-divider{
    height:1px;
    background:linear-gradient(90deg, var(--border-solid) 0%, transparent 100%);
    margin-top:60px;
